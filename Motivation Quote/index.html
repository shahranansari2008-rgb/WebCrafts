<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivora- Motivation Quotes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1 style="text-align: center;">Motivora</h1>
        <p class="subtitle">“One quote can change your mindset. One mindset can change your life. Get inspired, stay focused, and keep moving forward.” ✨</p>

        <div class="quote-box">

            <button onclick="getQuote()">
                ✨ New Quote
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
